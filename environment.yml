# To create/update this environment, run:
#   conda env create -f environment.yml

# To fully re-build the environment from scratch, run:
#   conda env remove -n monstim
#   conda clean --all
#   conda env create -f environment.yml

name: monstim
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.14.*
  - numpy=2.5.3
  - pandas=3.0.5
  - matplotlib-base=3.10.9
  - scipy=1.18.1
  - h5py=3.16.0
  - pyyaml=6.0.3
  - packaging=26.3
  - traitlets=5.16.1
  - pillow=12.3.0
  - pyside6=6.9.3
  - pyqtgraph=0.14.0
  - pip
  - pip:
      - openpyxl>=3.1
      - Markdown==3.10.3
      - python_markdown_math==0.9
      - pytest==9.1.1
      - setuptools==84.0.0
      - cryptography>=46.0

