site_name: MonStim Analyzer
site_description: Reproducible EMG curation, analysis, visualization, and export for MonStim laboratory exports.
site_url: https://worthy-lab.org/MonStim-Analyzer/
use_directory_urls: false
repo_url: https://github.com/AEWorthy/MonStim-Analyzer
repo_name: AEWorthy/MonStim-Analyzer
theme:
  name: material
  logo: https://raw.githubusercontent.com/AEWorthy/MonStim-Analyzer/main/assets/logo.png
  favicon: https://raw.githubusercontent.com/AEWorthy/MonStim-Analyzer/main/assets/icon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: cyan
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: cyan
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true
extra_javascript:
  - javascripts/mathjax.js
  - javascripts/home-carousel.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
extra_css:
  - stylesheets/home-carousel.css
nav:
  - Home: index.md
  - License: licensing.md
  - Get started:
      - Quick start: user/getting_started.md
      - Understanding the data hierarchy: user/data_hierarchy.md
      - Import experiments: user/importing_experiments.md
      - Importer add-ons: user/importer_addons.md
      - Updating MonStim: user/updates.md
      - Troubleshooting: user/troubleshooting.md
  - Using MonStim: user/using_monstim.md
  - Analyze and export:
      - Analysis profiles: user/analysis_profiles.md
      - Latency windows: user/latency_windows.md
      - Exporting results: user/exporting_results.md
      - How to cite MonStim: user/citing_monstim.md
  - Methods:
      - Analysis methods: science/analysis_methods.md
      - EMG processing: science/emg_processing.md
      - M-max estimation: science/mmax_estimation.md
  - Developers:
      - Overview: developer/index.md
      - Contributing: developer/contributing.md
      - Architecture: developer/architecture.md
      - Commands and undo: developer/command_testing_strategy.md
      - Annotation data versions: developer/data_versioning.md
      - Application settings: developer/qsettings_management.md
      - Documentation contribution guide: developer/documentation.md
      - Testing: developer/testing.md
      - Publishing releases: developer/releasing.md
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AEWorthy/MonStim-Analyzer
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/andrew-worthy
    - icon: fontawesome/brands/google-scholar
      link: https://scholar.google.com/citations?user=6g0k1
    - icon: fontawesome/solid/globe
      link: https://worthy-lab.org
      name: Worthy Lab website
copyright: Copyright 2024–2026 Andrew Worthy. MonStim Analyzer is licensed under PolyForm Noncommercial 1.0.0.
