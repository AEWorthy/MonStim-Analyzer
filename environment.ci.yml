name: monstim
channels:
  - conda-forge
  - defaults
dependencies:
  # The workflow creates monstim with its matrix-selected Python version.
  # Do not unconstrain it here: Conda otherwise upgrades it to the latest
  # release while updating the remaining dependencies.
  - numpy=2.5.*
  - pandas=3.*
  - matplotlib-base=3.*
  - scipy=1.17.*
  - h5py=3.16.*
  - pyyaml=6.0.*
  - packaging=26.*
  - traitlets=5.15.*
  - pillow=12.2.*
  - pyside6=6.9.*
  - pyqtgraph=0.14.*
  - pip
  - pip:
      - Markdown==3.10
      - python_markdown_math==0.9
      - pytest==9.1.0
      - setuptools==82.0.1
