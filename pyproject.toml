# Linting commands:
#   1. ruff check . --fix
#   2. ruff format .


[tool.ruff]
line-length = 150
target-version = "py310"
exclude = [
    ".git",
    ".github",
    ".mypy_cache",
    ".pytest_cache",
    ".venv",
    ".vscode",
    "__pycache__",
    "build",
    "dist",
    "docs",
    "data",
    "export",
]

[tool.ruff.lint]
select = ["E", "F", "I", "C"]
ignore = ["E402", "C901"] # skip module-level import not at top of file and McCabe complexity

[tool.ruff.lint.isort]
known-first-party = [
    "monstim_gui",
    "monstim_signals",
]

[tool.ruff.format]
quote-style = "double"